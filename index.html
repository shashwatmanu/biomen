  <!-- Premium loading screen — visible instantly before JS, dismissed smoothly after React mounts -->
  <style>
    @keyframes bl-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes bl-fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    #hero-skeleton {
      position: fixed; inset: 0;
      background: #030705;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9998;
      transition: opacity 0.5s cubic-bezier(0.4,0,0.2,1);
      animation: bl-fade-in 0.25s ease forwards;
    }
    #hero-skeleton img {
      width: 140px; height: 140px;
      object-fit: contain;
      animation: bl-spin 6s linear infinite;
      transform-origin: center center;
      filter: drop-shadow(0 0 28px rgba(22,199,132,0.3));
      opacity: 0.9;
    }
  </style>
